name: Daily video

on:
  schedule:
    # 12:47 UTC = 15:47 Riyadh, ~3h before the 19:00 posting slot (render + QA + upload take ~5 min).
    - cron: '47 12 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Post date YYYY-MM-DD (empty = today in POST_TIMEZONE)'
        required: false
      dry_run:
        description: 'Test only (render + QA, nothing uploaded or posted) — always on while PUBLISH_ENABLED is not true'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: autopilot-state
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
      BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
      STORAGE_DRIVER: ${{ vars.STORAGE_DRIVER || 's3' }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_PUBLIC_BASE_URL: ${{ secrets.S3_PUBLIC_BASE_URL }}
      NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
      BRAND_HANDLE: ${{ vars.BRAND_HANDLE }}
      CTA_TEXT: ${{ vars.CTA_TEXT }}
      POST_TIME_LOCAL: ${{ vars.POST_TIME_LOCAL || '19:00' }}
      POST_TIMEZONE: ${{ vars.POST_TIMEZONE || 'Asia/Riyadh' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Publishing lock: nothing is uploaded or posted until the repository variable PUBLISH_ENABLED is 'true'.
      DRY_RUN: ${{ (inputs.dry_run || vars.PUBLISH_ENABLED != 'true') && 'true' || 'false' }}
      ACTOR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Cache Remotion browser
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm test
      - name: Generate, check and publish
        env:
          DATE_INPUT: ${{ inputs.date }}
        run: |
          if [ -n "$DATE_INPUT" ] && ! [[ "$DATE_INPUT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then echo "bad date"; exit 1; fi
          node scripts/run.mjs daily $DATE_INPUT
      - name: Keep the video as a run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: out/**/*.mp4
          retention-days: 14
          if-no-files-found: ignore
      - name: Save state and dashboard
        if: always()
        run: |
          git config user.name "design-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state docs
          git diff --cached --quiet && exit 0
          git commit -m "autopilot: daily run ${{ github.run_id }} [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
